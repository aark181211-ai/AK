<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050812"><link rel="manifest" href="manifest.json">
<title>JARVIS AK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050812;color:#eaf4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto}.top{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #16243a}
.brand{font-weight:800;letter-spacing:2px}.status{font-size:12px;color:#79d9ff}.btn{border:1px solid #203550;background:#0b1424;color:#dff5ff;border-radius:12px;padding:9px 11px;cursor:pointer}
.orbwrap{display:flex;justify-content:center;align-items:center;padding:20px 0 8px}.orb{width:105px;height:105px;border-radius:50%;border:2px solid #58d8ff;box-shadow:0 0 25px #1a9dcc, inset 0 0 25px #0e4160;display:grid;place-items:center;font-weight:800;letter-spacing:2px;animation:pulse 2.5s infinite}.thinking{animation:pulse .65s infinite}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 42px #1a9dcc,inset 0 0 30px #0e4160}}
.chat{flex:1;overflow:auto;padding:12px 14px}.msg{max-width:86%;padding:11px 13px;border-radius:16px;margin:9px 0;white-space:pre-wrap;line-height:1.45}.user{margin-left:auto;background:#12304a}.ai{background:#0c1422;border:1px solid #1a2b42}.empty{text-align:center;color:#71849b;margin-top:35px}
.bottom{padding:12px 14px 16px;border-top:1px solid #16243a}.row{display:flex;gap:8px}.input{flex:1;background:#0a1220;color:#fff;border:1px solid #203550;border-radius:15px;padding:13px;outline:none}.send{min-width:52px}.tools{display:flex;gap:7px;margin-top:8px;overflow:auto}.tools .btn{font-size:12px;white-space:nowrap}
.panel{position:fixed;inset:0;background:#050812f5;display:none;padding:18px;z-index:5}.panel.open{display:block}.card{max-width:700px;margin:auto;background:#0a1220;border:1px solid #203550;border-radius:18px;padding:18px}.field{width:100%;margin:6px 0 12px;background:#070e1a;color:#fff;border:1px solid #203550;border-radius:10px;padding:11px}.note{font-size:12px;color:#8da0b6;line-height:1.4}
</style></head>
<body>
<div class="app">
<header class="top"><div class="brand">JARVIS AK</div><div><span id="status" class="status">Ready</span> <button class="btn" onclick="openSettings()">⚙</button></div></header>
<section class="orbwrap"><div id="orb" class="orb">AK</div></section>
<main id="chat" class="chat"><div id="empty" class="empty">Hello. I am JARVIS AK.<br>Configure your API in Settings and start chatting.</div></main>
<footer class="bottom">
<div class="row"><input id="input" class="input" placeholder="Ask JARVIS anything..." autocomplete="off"><button class="btn send" onclick="send()">➤</button></div>
<div class="tools"><button class="btn" onclick="voice()">🎙 Voice</button><button class="btn" onclick="speakLast()">🔊 Speak</button><button class="btn" onclick="newChat()">＋ New Chat</button><button class="btn" onclick="clearChat()">Clear</button></div>
</footer></div>
<div id="settings" class="panel"><div class="card"><h2>JARVIS Settings</h2>
<label>API Key</label><input id="key" class="field" type="password" placeholder="Paste your API key">
<label>API Endpoint</label><input id="endpoint" class="field" placeholder="https://api.openai.com/v1/chat/completions">
<label>Model</label><input id="model" class="field" placeholder="Enter your model name">
<label>System Prompt</label><textarea id="system" class="field" rows="4">You are JARVIS AK, a helpful personal AI assistant. Give clear, accurate and concise answers.</textarea>
<p class="note">Your key is stored only in this browser's local storage. A client-only app cannot keep an API key truly secret. AI requests require internet access.</p>
<button class="btn" onclick="saveSettings()">Save</button> <button class="btn" onclick="closeSettings()">Close</button></div></div>
<script>
const $=id=>document.getElementById(id);
let messages=JSON.parse(localStorage.getItem("jarvis_messages")||"[]");
let cfg=JSON.parse(localStorage.getItem("jarvis_cfg")||"{}");
function init(){ $("key").value=cfg.key||"";$("endpoint").value=cfg.endpoint||"https://api.openai.com/v1/chat/completions";$("model").value=cfg.model||"";$("system").value=cfg.system||$("system").value;render(); }
function render(){ $("chat").innerHTML=""; if(!messages.length){$("chat").innerHTML='<div id="empty" class="empty">Hello. I am JARVIS AK.<br>Configure your API in Settings and start chatting.</div>';return} messages.forEach(m=>{if(m.role==="system")return;let d=document.createElement("div");d.className="msg "+(m.role==="user"?"user":"ai");d.textContent=m.content;$("chat").appendChild(d)});$("chat").scrollTop=$("chat").scrollHeight}
function save(){localStorage.setItem("jarvis_messages",JSON.stringify(messages))}
function setStatus(t){$("status").textContent=t}
async function send(){let text=$("input").value.trim();if(!text)return;if(!cfg.key||!cfg.endpoint||!cfg.model){openSettings();return}
$("input").value="";messages.push({role:"user",content:text});render();save();setStatus("Thinking");$("orb").classList.add("thinking");
try{let apiMessages=[{role:"system",content:cfg.system||"You are JARVIS AK."},...messages];let r=await fetch(cfg.endpoint,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},body:JSON.stringify({model:cfg.model,messages:apiMessages})});let data=await r.json();if(!r.ok)throw new Error(data?.error?.message||"API request failed ("+r.status+")");let answer=data?.choices?.[0]?.message?.content||data?.output_text||"No response returned.";messages.push({role:"assistant",content:answer});render();save();setStatus("Ready");speak(answer)}catch(e){messages.push({role:"assistant",content:"Error: "+e.message});render();save();setStatus("Error")}finally{$("orb").classList.remove("thinking")}}
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function speakLast(){let a=[...messages].reverse().find(x=>x.role==="assistant");if(a)speak(a.content)}
function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert("Voice input is not supported in this browser.");return}let r=new R();r.lang="en-IN";r.onstart=()=>setStatus("Listening");r.onresult=e=>{$("input").value=e.results[0][0].transcript;send()};r.onerror=()=>setStatus("Ready");r.onend=()=>setStatus("Ready");r.start()}
function newChat(){messages=[];save();render();setStatus("Ready")}
function clearChat(){if(confirm("Clear this chat?"))newChat()}
function openSettings(){$("settings").classList.add("open")}
function closeSettings(){$("settings").classList.remove("open")}
function saveSettings(){cfg={key:$("key").value.trim(),endpoint:$("endpoint").value.trim(),model:$("model").value.trim(),system:$("system").value.trim()};localStorage.setItem("jarvis_cfg",JSON.stringify(cfg));closeSettings();setStatus("Ready")}
$("input").addEventListener("keydown",e=>{if(e.key==="Enter")send()});init();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
