<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="description" content="Ledger Lite - offline accounting and inventory"><link rel="manifest" href="manifest.json"><title>Ledger Lite</title><style>
:root{--blue:#2563eb;--blue2:#1d4ed8;--green:#16a34a;--red:#dc2626;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--nav:#0f2f66}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:235px;background:#102f66;color:white;padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:10}.brand{font-size:21px;font-weight:800;padding:8px 10px 20px}.brand small{display:block;font-size:10px;font-weight:500;opacity:.8;margin-top:3px}.nav button{width:100%;background:transparent;color:#dbeafe;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0}.nav button.active,.nav button:hover{background:#1d4ed8;color:#fff}.main{margin-left:235px;width:calc(100% - 235px);min-width:0}.top{height:64px;background:linear-gradient(110deg,#2563eb,#1e40af);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:8}.top .title{font-size:20px;font-weight:750}.top .right{text-align:right;line-height:1.15}.top .right strong{font-size:16px}.top .right small{font-size:10px;opacity:.9}.content{padding:20px;max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 2px 8px #0f172a0a}.metric{font-size:20px;font-weight:800;margin-top:6px}.label{color:var(--muted);font-size:12px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.btn{padding:10px 13px;border-radius:9px;background:#e8eefb;color:#17356f;font-weight:650}.btn.primary{background:var(--blue);color:#fff}.btn.green{background:#dcfce7;color:#166534}.btn.red{background:#fee2e2;color:#991b1b}.btn.danger{background:#fee2e2;color:#991b1b}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--card);color:var(--text)}.search{min-width:220px;flex:1}.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted);background:#f8fafc}.empty{text-align:center;padding:40px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px}.sectionhead h2{margin:0;font-size:19px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin:0 0 5px}.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.show{display:flex}.dialog{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:15px;padding:18px}.dialog h3{margin:0 0 15px}.form{display:grid;gap:11px}.dialogfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;right:18px;bottom:80px;background:#172033;color:#fff;padding:11px 14px;border-radius:9px;display:none;z-index:50}.toast.show{display:block}.bottom{display:none}.low{background:#fff7ed}.pill{display:inline-block;padding:3px 7px;border-radius:20px;background:#e8eefb;color:#23417b;font-size:11px}.online{font-size:11px;color:#dcfce7}.dangerText{color:var(--red)}body.dark{--bg:#0b1220;--card:#111a2b;--text:#e5edf9;--muted:#9aabc2;--border:#24324a}body.dark .table th{background:#172235}.printarea{background:white;color:#111;padding:24px}.printarea h1{color:#1d4ed8}.printhead{display:flex;justify-content:space-between;border-bottom:2px solid #2563eb;padding-bottom:10px;margin-bottom:16px}.printbrand{background:#2563eb;color:#fff;padding:9px;border-radius:6px;text-align:right}.printtable{width:100%;border-collapse:collapse}.printtable th,.printtable td{border:1px solid #ddd;padding:7px}.printtable th{background:#eef4ff}@media(max-width:900px){.side{display:none}.main{margin-left:0;width:100%}.cards{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:20;padding:5px;justify-content:space-around}.bottom button{background:none;color:var(--muted);font-size:11px;padding:5px}.bottom button b{display:block;font-size:18px}.content{padding:14px 12px 75px}.top{padding:0 13px}.grid2,.grid3{grid-template-columns:1fr}}@media(max-width:500px){.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.metric{font-size:17px}.actions{gap:7px}.btn{padding:9px 8px;font-size:12px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Ledger Lite<small>Offline accounting & inventory</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div class="title" id="pageTitle">Dashboard</div><div class="right"><strong>Ledger Lite</strong><br><small>https://ledger-lite-18.lovable.app/</small></div></header><div class="content" id="view"></div></main></div><nav class="bottom" id="bottom"></nav><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div><script>
const KEY='ledger-lite-v1';const defaultData={settings:{businessName:'',address:'',phone:'',currency:'₹',dark:false,negative:false,prefix:'INV-'},accounts:[],customers:[],suppliers:[],items:[],groups:[],transactions:[],sales:[],purchases:[]};let db=load();let page='dashboard';
function load(){try{return {...structuredClone(defaultData),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaultData)}}function save(){localStorage.setItem(KEY,JSON.stringify(db));applyTheme()}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2)}function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',currencyDisplay:'symbol',maximumFractionDigits:2}).format(Number(n)||0)}function num(v){return Number(v)||0}function esc(v=''){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function today(){return new Date().toISOString().slice(0,10)}function now(){return new Date().toTimeString().slice(0,5)}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function applyTheme(){document.body.classList.toggle('dark',!!db.settings.dark)}
const navs=[['dashboard','Dashboard'],['accounts','Accounts'],['customers','Customers'],['suppliers','Suppliers'],['sales','Sales'],['purchases','Purchases'],['stock','Stock'],['transactions','Transactions'],['reports','Reports'],['backup','Backup'],['settings','Settings']];
function init(){applyTheme();document.getElementById('nav').innerHTML=navs.map(x=>`<button data-page="${x[0]}">${x[1]}</button>`).join('');document.getElementById('bottom').innerHTML=[['dashboard','⌂'],['sales','＋'],['purchases','▣'],['stock','□'],['reports','▤']].map(x=>`<button data-page="${x[0]}"><b>${x[1]}</b>${x[0]}</button>`).join('');document.body.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render()}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
function render(){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.getElementById('pageTitle').textContent=navs.find(x=>x[0]===page)?.[1]||'Dashboard';const v=document.getElementById('view');({dashboard:dashboard,accounts:accounts,customers:customers,suppliers:suppliers,sales:sales,purchases:purchases,stock:stock,transactions:transactions,reports:reports,backup:backup,settings:settings}[page]||dashboard)(v)}
function stats(){let received=db.transactions.filter(t=>t.type==='received').reduce((a,t)=>a+num(t.amount),0),given=db.transactions.filter(t=>t.type==='given').reduce((a,t)=>a+num(t.amount),0),sales=db.sales.reduce((a,t)=>a+num(t.total),0),purchases=db.purchases.reduce((a,t)=>a+num(t.total),0);let cash=balance('Cash'),bank=balance('Bank');let stock=db.items.reduce((a,i)=>a+num(i.qty)*num(i.purchaseRate||i.openingRate),0);let profit=0;db.sales.forEach(s=>{let it=db.items.find(i=>i.id===s.itemId);if(it&&it.purchaseRate!=null&&it.purchaseRate!=='')profit+=(num(s.rate)-num(it.purchaseRate))*num(s.qty)-num(s.discount||0)});let customer=db.customers.reduce((a,c)=>a+partyBalance('customer',c.id),0),supplier=db.suppliers.reduce((a,c)=>a+partyBalance('supplier',c.id),0);return{received,given,sales,purchases,cash,bank,stock,profit,customer,supplier}}
function balance(name){let a=db.accounts.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!a)return 0;let b=num(a.opening);db.transactions.forEach(t=>{if(t.accountId===a.id)b+=(t.type==='received'?num(t.amount):-num(t.amount))});db.sales.filter(s=>s.payment==='Cash'&&s.accountId===a.id).forEach(s=>b+=num(s.total));db.purchases.filter(s=>s.payment==='Cash'&&s.accountId===a.id).forEach(s=>b-=num(s.total));db.sales.filter(s=>s.payment==='Bank'&&s.accountId===a.id).forEach(s=>b+=num(s.total));db.purchases.filter(s=>s.payment==='Bank'&&s.accountId===a.id).forEach(s=>b-=num(s.total));return b}
function partyBalance(type,pid){let p=(type==='customer'?db.customers:db.suppliers).find(x=>x.id===pid);let b=num(p?.opening);if(type==='customer'){db.sales.filter(s=>s.customerId===pid&&s.payment==='Credit').forEach(s=>b+=num(s.total));db.transactions.filter(t=>t.partyId===pid&&t.partyType==='customer').forEach(t=>b+=(t.type==='given'?-num(t.amount):num(t.amount)))}else{db.purchases.filter(s=>s.supplierId===pid&&s.payment==='Credit').forEach(s=>b+=num(s.total));db.transactions.filter(t=>t.partyId===pid&&t.partyType==='supplier').forEach(t=>b+=(t.type==='given'?-num(t.amount):num(t.amount)))}return b}
function dashboard(v){let s=stats();v.innerHTML=`<div class="cards">${[['Cash Balance',s.cash,'blue'],['Bank Balance',s.bank,'blue'],['Money Received',s.received,'green'],['Money Given',s.given,'red'],['Total Sales',s.sales,'green'],['Total Purchases',s.purchases,'blue'],['Stock Value',s.stock,'blue'],['Profit',s.profit,s.profit>=0?'green':'red'],['Loss',Math.max(0,-s.profit),'red'],['Customer Outstanding',s.customer,'blue'],['Supplier Outstanding',s.supplier,'blue'],['Total Customers',db.customers.length,'blue'],['Total Suppliers',db.suppliers.length,'blue'],['Total Stock Items',db.items.length,'blue']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric ${x[2]}">${typeof x[1]==='number'&&['Total Customers','Total Suppliers','Total Stock Items'].includes(x[0])?x[1]:money(x[1])}</div></div>`).join('')}</div><div class="actions"><button class="btn green" onclick="openTxn('received')">Money Received</button><button class="btn red" onclick="openTxn('given')">Money Given</button><button class="btn primary" onclick="openSale()">New Sale</button><button class="btn primary" onclick="openPurchase()">New Purchase</button><button class="btn" onclick="openParty('customer')">Add Customer</button><button class="btn" onclick="openParty('supplier')">Add Supplier</button><button class="btn" onclick="openItem()">Add Stock Item</button><button class="btn" onclick="openAccount()">Add Account</button></div><div class="sectionhead"><h2>Recent Transactions</h2><button class="btn" onclick="page='transactions';render()">View all</button></div>${transactionTable(db.transactions.slice().sort((a,b)=>b.created-a).slice(0,8))}`}
function transactionTable(rows){if(!rows.length)return '<div class="card empty">No transactions yet.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Account</th><th>Party</th><th>Amount</th><th>Note</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.date)}</td><td>${labelType(t.type)}</td><td>${esc(nameAccount(t.accountId))}</td><td>${esc(t.partyName||'')}</td><td class="${t.type==='received'?'green':t.type==='given'?'red':'blue'}">${money(t.amount)}</td><td>${esc(t.note||'')}</td></tr>`).join('')}</tbody></table></div>`}
function labelType(t){return {received:'Money Received',given:'Money Given',sale:'Sale',purchase:'Purchase',stockin:'Stock In',stockout:'Stock Out',adjust:'Stock Adjustment'}[t]||t}function nameAccount(id){return db.accounts.find(x=>x.id===id)?.name||'—'}function nameParty(type,id){return (type==='customer'?db.customers:db.suppliers).find(x=>x.id===id)?.name||'—'}
function listPage(title,rows,cols,add){return `<div class="sectionhead"><h2>${title}</h2><button class="btn primary" onclick="${add}">+ Add</button></div><div class="toolbar"><input class="search" placeholder="Search..." oninput="filterTable(this)"><button class="btn" onclick="render()">Refresh</button></div><div class="tablewrap"><table class="table" id="list"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}<td><button class="btn" onclick="${r._edit}">Edit</button> <button class="btn danger" onclick="${r._del}">Delete</button></td></tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="empty">No records found.</td></tr>`}</tbody></table></div>`}
function filterTable(input){const q=input.value.toLowerCase();document.querySelectorAll('#list tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function accounts(v){const rows=db.accounts.map(a=>({...a,_edit:`openAccount('${a.id}')`,_del:`delRecord('accounts','${a.id}')`}));v.innerHTML=listPage('Accounts',rows,[['Name',r=>esc(r.name)],['Type',r=>esc(r.type)],['Opening',r=>money(r.opening)],['Current',r=>money(balance(r.name))]],'openAccount()')}
function customers(v){const rows=db.customers.map(r=>({...r,_edit:`openParty('customer','${r.id}')`,_del:`delRecord('customers','${r.id}')`}));v.innerHTML=listPage('Customers',rows,[['Name',r=>esc(r.name)],['Phone',r=>esc(r.phone)],['Balance',r=>money(partyBalance('customer',r.id))],['Address',r=>esc(r.address)]],'openParty(\'customer\')')}
function suppliers(v){const rows=db.suppliers.map(r=>({...r,_edit:`openParty('supplier','${r.id}')`,_del:`delRecord('suppliers','${r.id}')`}));v.innerHTML=listPage('Suppliers',rows,[['Name',r=>esc(r.name)],['Phone',r=>esc(r.phone)],['Balance',r=>money(partyBalance('supplier',r.id))],['Address',r=>esc(r.address)]],'openParty(\'supplier\')')}
function stock(v){const rows=db.items.map(r=>({...r,_edit:`openItem('${r.id}')`,_del:`delRecord('items','${r.id}')`}));v.innerHTML=`<div class="sectionhead"><h2>Stock Items</h2><div><button class="btn" onclick="openGroup()">Stock Groups</button> <button class="btn primary" onclick="openItem()">+ Add Item</button></div></div><div class="toolbar"><input class="search" placeholder="Search items..." oninput="filterTable(this)"></div><div class="tablewrap"><table class="table" id="list"><thead><tr><th>Item</th><th>Code</th><th>Group</th><th>Unit</th><th>Qty</th><th>Purchase Rate</th><th>Sales Rate</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr class="${num(r.qty)<=num(r.min) ? 'low':''}"><td>${esc(r.name)}</td><td>${esc(r.code)}</td><td>${esc(groupName(r.groupId))}</td><td>${esc(r.unit)}</td><td>${num(r.qty)}</td><td>${money(r.purchaseRate)}</td><td>${money(r.salesRate)}</td><td>${num(r.qty)<=num(r.min)?'<span class="dangerText">Low stock</span>':'OK'}</td><td><button class="btn" onclick="${r._edit}">Edit</button> <button class="btn danger" onclick="${r._del}">Delete</button></td></tr>`).join(''):`<tr><td colspan="9" class="empty">No stock items yet.</td></tr>`}</tbody></table></div>`}function groupName(id){return db.groups.find(g=>g.id===id)?.name||'General'}
function sales(v){const rows=db.sales.slice().reverse();v.innerHTML=`<div class="sectionhead"><h2>Sales</h2><button class="btn primary" onclick="openSale()">+ New Sale</button></div><div class="toolbar"><input class="search" placeholder="Search invoice/customer/item..." oninput="filterTable(this)"></div><div class="tablewrap"><table class="table" id="list"><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Item</th><th>Qty</th><th>Total</th><th>Payment</th><th>Profit</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(s=>`<tr><td>${esc(s.invoice)}</td><td>${s.date}</td><td>${esc(nameParty('customer',s.customerId))}</td><td>${esc(db.items.find(i=>i.id===s.itemId)?.name||'')}</td><td>${s.qty}</td><td class="green">${money(s.total)}</td><td>${s.payment}</td><td class="${s.profit>=0?'green':'red'}">${s.costKnown?money(s.profit):'—'}</td><td><button class="btn" onclick="printDoc('sale','${s.id}')">Print</button> <button class="btn danger" onclick="delSale('${s.id}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="9" class="empty">No sales yet.</td></tr>`}</tbody></table></div>`}
function purchases(v){const rows=db.purchases.slice().reverse();v.innerHTML=`<div class="sectionhead"><h2>Purchases</h2><button class="btn primary" onclick="openPurchase()">+ New Purchase</button></div><div class="toolbar"><input class="search" placeholder="Search invoice/supplier/item..." oninput="filterTable(this)"></div><div class="tablewrap"><table class="table" id="list"><thead><tr><th>Invoice</th><th>Date</th><th>Supplier</th><th>Item</th><th>Qty</th><th>Total</th><th>Payment</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(s=>`<tr><td>${esc(s.invoice)}</td><td>${s.date}</td><td>${esc(nameParty('supplier',s.supplierId))}</td><td>${esc(db.items.find(i=>i.id===s.itemId)?.name||'')}</td><td>${s.qty}</td><td class="blue">${money(s.total)}</td><td>${s.payment}</td><td><button class="btn" onclick="printDoc('purchase','${s.id}')">Print</button> <button class="btn danger" onclick="delPurchase('${s.id}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="8" class="empty">No purchases yet.</td></tr>`}</tbody></table></div>`}
function transactions(v){v.innerHTML=`<div class="sectionhead"><h2>Transactions</h2><div><button class="btn green" onclick="openTxn('received')">Money Received</button> <button class="btn red" onclick="openTxn('given')">Money Given</button></div></div><div class="toolbar"><input class="search" placeholder="Search transactions..." oninput="filterTable(this)"><select onchange="filterType(this.value)"><option value="">All types</option><option value="received">Money Received</option><option value="given">Money Given</option><option value="sale">Sale</option><option value="purchase">Purchase</option></select></div>${transactionTable(db.transactions.slice().reverse())}`}
function filterType(t){document.querySelectorAll('.table tbody tr').forEach(r=>r.style.display=!t||r.textContent.toLowerCase().includes(labelType(t).toLowerCase())?'':'none')}
function reports(v){let s=stats();v.innerHTML=`<div class="sectionhead"><h2>Reports</h2><button class="btn primary" onclick="printReport()">Print / PDF</button></div><div class="grid3">${[['Sales Report',s.sales],['Purchase Report',s.purchases],['Money Received',s.received],['Money Given',s.given],['Stock Valuation',s.stock],['Profit',s.profit],['Customer Outstanding',s.customer],['Supplier Outstanding',s.supplier],['Cash + Bank',s.cash+s.bank]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric blue">${money(x[1])}</div></div>`).join('')}</div><div class="card" style="margin-top:15px"><h3>Profit & Loss</h3><p>Sales Revenue: <b class="green">${money(s.sales)}</b></p><p>Gross Profit: <b class="${s.profit>=0?'green':'red'}">${money(s.profit)}</b></p><p>Loss: <b class="red">${money(Math.max(0,-s.profit))}</b></p><p class="label">Profit is calculated only for sales where the item's purchase cost is available.</p></div>`}
function backup(v){v.innerHTML=`<div class="sectionhead"><h2>Backup</h2></div><div class="grid2"><div class="card"><h3>Export Backup</h3><p>Download all Ledger Lite data as JSON.</p><button class="btn primary" onclick="exportData()">Export Backup</button></div><div class="card"><h3>Import Backup</h3><p>Restore a previously exported JSON file. Existing data will be replaced.</p><input type="file" accept="application/json" onchange="importData(this)"></div></div><div class="card" style="margin-top:14px"><h3>Data stored locally</h3><p>Ledger Lite does not send accounting data to a server. Your records are stored in this browser.</p></div>`}
function settings(v){v.innerHTML=`<div class="sectionhead"><h2>Settings</h2></div><div class="card"><div class="form"><div class="grid2"><div class="field"><label>Business Name</label><input id="biz" value="${esc(db.settings.businessName)}"></div><div class="field"><label>Phone</label><input id="phone" value="${esc(db.settings.phone)}"></div><div class="field"><label>Business Address</label><input id="addr" value="${esc(db.settings.address)}"></div><div class="field"><label>Currency</label><input id="cur" value="${esc(db.settings.currency||'₹')}"></div></div><label><input type="checkbox" id="dark" ${db.settings.dark?'checked':''}> Dark mode</label><label><input type="checkbox" id="negative" ${db.settings.negative?'checked':''}> Allow Negative Stock</label><div class="field"><label>Invoice Prefix</label><input id="prefix" value="${esc(db.settings.prefix||'INV-')}"></div><button class="btn primary" onclick="saveSettings()">Save Settings</button><button class="btn danger" onclick="clearData()">Clear All Data</button></div></div>`}
function modal(title,body,savefn){document.getElementById('dialog').innerHTML=`<h3>${title}</h3>${body}<div class="dialogfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="modalSave">Save</button></div>`;document.getElementById('modalSave').onclick=savefn;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function openAccount(edit=''){let a=db.accounts.find(x=>x.id===edit)||{};modal(edit?'Edit Account':'Add Account',`<div class="form"><div class="field"><label>Name *</label><input id="f_name" value="${esc(a.name||'')}"></div><div class="field"><label>Type</label><select id="f_type">${['Cash','Bank','Customer','Supplier','Other'].map(x=>`<option ${a.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Opening Balance</label><input id="f_open" type="number" step="0.01" value="${num(a.opening)}"></div></div>`,()=>{let name=f('f_name');if(!name)return toast('Account name is required');if(edit){Object.assign(a,{name,type:f('f_type'),opening:num(f('f_open'))})}else db.accounts.push({id:id(),name,type:f('f_type'),opening:num(f('f_open'))});save();closeModal();render();toast('Account saved')})}
function openParty(type,edit=''){let arr=type==='customer'?db.customers:db.suppliers,p=arr.find(x=>x.id===edit)||{};modal((edit?'Edit ':'Add ')+(type==='customer'?'Customer':'Supplier'),`<div class="form"><div class="grid2"><div class="field"><label>Name *</label><input id="f_name" value="${esc(p.name||'')}"></div><div class="field"><label>Phone</label><input id="f_phone" value="${esc(p.phone||'')}"></div><div class="field"><label>Address</label><input id="f_addr" value="${esc(p.address||'')}"></div><div class="field"><label>Opening Balance</label><input id="f_open" type="number" step="0.01" value="${num(p.opening)}"></div></div><div class="field"><label>Notes</label><textarea id="f_note">${esc(p.notes||'')}</textarea></div></div>`,()=>{let name=f('f_name');if(!name)return toast('Name is required');let x={name,phone:f('f_phone'),address:f('f_addr'),opening:num(f('f_open')),notes:f('f_note')};if(edit)Object.assign(p,x);else arr.push({id:id(),...x});save();closeModal();render();toast('Saved')})}
function openGroup(edit=''){let g=db.groups.find(x=>x.id===edit)||{};modal(edit?'Edit Stock Group':'Add Stock Group',`<div class="field"><label>Group Name *</label><input id="f_name" value="${esc(g.name||'')}"></div>`,()=>{let n=f('f_name');if(!n)return toast('Name required');if(edit)g.name=n;else db.groups.push({id:id(),name:n});save();closeModal();render();toast('Group saved')})}
function openItem(edit=''){let x=db.items.find(i=>i.id===edit)||{};modal(edit?'Edit Stock Item':'Add Stock Item',`<div class="form"><div class="grid2"><div class="field"><label>Item Name *</label><input id="f_name" value="${esc(x.name||'')}"></div><div class="field"><label>Item Code</label><input id="f_code" value="${esc(x.code||'')}"></div><div class="field"><label>Barcode</label><input id="f_bar" value="${esc(x.barcode||'')}"></div><div class="field"><label>Stock Group</label><select id="f_group"><option value="">General</option>${db.groups.map(g=>`<option value="${g.id}" ${x.groupId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>Unit</label><select id="f_unit">${['Nos','Kg','Gram','Litre','Ml','Box','Pack','Meter','Piece'].map(u=>`<option ${x.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field"><label>Opening Quantity</label><input id="f_qty" type="number" step="0.001" value="${num(x.openingQty)}"></div><div class="field"><label>Opening Rate</label><input id="f_openrate" type="number" step="0.01" value="${num(x.openingRate)}"></div><div class="field"><label>Purchase Rate</label><input id="f_prate" type="number" step="0.01" value="${x.purchaseRate??''}"></div><div class="field"><label>Sales Rate</label><input id="f_srate" type="number" step="0.01" value="${x.salesRate??''}"></div><div class="field"><label>Minimum Stock Level</label><input id="f_min" type="number" step="0.001" value="${num(x.min)}"></div></div><div class="field"><label>Description</label><textarea id="f_desc">${esc(x.description||'')}</textarea></div></div>`,()=>{let name=f('f_name');if(!name)return toast('Item name required');let q=num(f('f_qty'));if(edit){Object.assign(x,{name,code:f('f_code'),barcode:f('f_bar'),groupId:f('f_group'),unit:f('f_unit'),purchaseRate:f('f_prate'),salesRate:f('f_srate'),min:num(f('f_min')),description:f('f_desc')})}else db.items.push({id:id(),name,code:f('f_code'),barcode:f('f_bar'),groupId:f('f_group'),unit:f('f_unit'),openingQty:q,openingRate:num(f('f_openrate')),qty:q,purchaseRate:f('f_prate'),salesRate:f('f_srate'),min:num(f('f_min')),description:f('f_desc')});save();closeModal();render();toast('Item saved')})}
function openTxn(type){modal(type==='received'?'Money Received':'Money Given',`<div class="form"><div class="grid2"><div class="field"><label>Date</label><input id="f_date" type="date" value="${today()}"></div><div class="field"><label>Time</label><input id="f_time" type="time" value="${now()}"></div><div class="field"><label>Account *</label><select id="f_account">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Party Type</label><select id="f_pt"><option value="">Other</option><option value="customer">Customer</option><option value="supplier">Supplier</option></select></div><div class="field"><label>Customer/Supplier/Other</label><select id="f_party"><option value="">Other</option></select></div><div class="field"><label>Amount *</label><input id="f_amount" type="number" min="0.01" step="0.01"></div><div class="field"><label>Payment Mode</label><select id="f_mode"><option>Cash</option><option>Bank</option><option>Other</option></select></div></div><div class="field"><label>Note</label><textarea id="f_note"></textarea></div></div>`,()=>{let amount=num(f('f_amount'));if(amount<=0)return toast('Enter a valid amount');let pt=f('f_pt'),pid=f('f_party'),pname=pt?nameParty(pt,pid):'Other';db.transactions.push({id:id(),type,date:f('f_date'),time:f('f_time'),accountId:f('f_account'),partyType:pt,partyId:pid,partyName:pname,amount,payment:f('f_mode'),note:f('f_note'),created:Date.now()});save();closeModal();render();toast('Transaction saved')});setTimeout(()=>document.getElementById('f_pt').onchange=()=>{let pt=f('f_pt'),arr=pt==='customer'?db.customers:pt==='supplier'?db.suppliers:[];document.getElementById('f_party').innerHTML='<option value="">Other</option>'+arr.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')},0)}
function openSale(edit=''){let s=db.sales.find(x=>x.id===edit)||{},it=db.items.find(i=>i.id===s.itemId)||{},total=num(s.total);modal(edit?'Edit Sale':'New Sale',`<div class="form"><div class="grid2"><div class="field"><label>Invoice Number</label><input id="f_inv" value="${esc(s.invoice||nextInvoice())}"></div><div class="field"><label>Date</label><input id="f_date" type="date" value="${s.date||today()}"></div><div class="field"><label>Customer</label><select id="f_customer"><option value="">Cash Customer</option>${db.customers.map(c=>`<option value="${c.id}" ${s.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Stock Item *</label><select id="f_item">${db.items.map(i=>`<option value="${i.id}" ${s.itemId===i.id?'selected':''}>${esc(i.name)} (stock ${num(i.qty)})</option>`).join('')}</select></div><div class="field"><label>Quantity *</label><input id="f_qty" type="number" min="0.001" step="0.001" value="${num(s.qty)}"></div><div class="field"><label>Unit</label><input id="f_unit" value="${esc(s.unit||it.unit||'Nos')}" readonly></div><div class="field"><label>Rate</label><input id="f_rate" type="number" min="0" step="0.01" value="${num(s.rate||it.salesRate)}"></div><div class="field"><label>Discount</label><input id="f_disc" type="number" min="0" step="0.01" value="${num(s.discount)}"></div><div class="field"><label>Total</label><input id="f_total" value="${money(total)}" readonly></div><div class="field"><label>Payment</label><select id="f_payment"><option>Cash</option><option>Bank</option><option>Credit</option></select></div><div class="field"><label>Account</label><select id="f_account"><option value="">Auto</option>${db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div></div><div class="field"><label>Notes</label><textarea id="f_note">${esc(s.note||'')}</textarea></div></div>`,()=>{let item=db.items.find(i=>i.id===f('f_item')),q=num(f('f_qty')),rate=num(f('f_rate')),disc=num(f('f_disc'));if(!item||q<=0)return toast('Enter item and quantity');if(!edit&&!db.settings.negative&&q>num(item.qty))return toast('Not enough stock');let old=edit?num(s.qty):0;if(edit){item.qty+=old; if(!db.settings.negative&&q>item.qty)return toast('Not enough stock');}item.qty-=q;let tot=Math.max(0,q*rate-disc),costKnown=item.purchaseRate!==''&&item.purchaseRate!=null&&isFinite(num(item.purchaseRate)),profit=costKnown?(rate-num(item.purchaseRate))*q-disc:0;let rec={id:s.id||id(),invoice:f('f_inv'),date:f('f_date'),customerId:f('f_customer'),itemId:item.id,qty:q,unit:f('f_unit'),rate,discount:disc,total:tot,payment:f('f_payment'),accountId:f('f_account'),note:f('f_note'),profit,costKnown,created:s.created||Date.now()};if(edit)Object.assign(s,rec);else db.sales.push(rec);save();closeModal();render();toast('Sale saved')});setTimeout(()=>{const qi=document.getElementById('f_qty'),ri=document.getElementById('f_rate'),di=document.getElementById('f_disc');[qi,ri,di].forEach(x=>x&&x.addEventListener('input',()=>document.getElementById('f_total').value=money(num(qi.value)*num(ri.value)-num(di.value))))},0)}
function openPurchase(edit=''){let s=db.purchases.find(x=>x.id===edit)||{},it=db.items.find(i=>i.id===s.itemId)||{};modal(edit?'Edit Purchase':'New Purchase',`<div class="form"><div class="grid2"><div class="field"><label>Invoice Number</label><input id="f_inv" value="${esc(s.invoice||('PUR-'+Date.now().toString().slice(-6)))}"></div><div class="field"><label>Date</label><input id="f_date" type="date" value="${s.date||today()}"></div><div class="field"><label>Supplier</label><select id="f_supplier"><option value="">Other Supplier</option>${db.suppliers.map(c=>`<option value="${c.id}" ${s.supplierId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Stock Item *</label><select id="f_item">${db.items.map(i=>`<option value="${i.id}" ${s.itemId===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select></div><div class="field"><label>Quantity *</label><input id="f_qty" type="number" min="0.001" step="0.001" value="${num(s.qty)}"></div><div class="field"><label>Unit</label><input id="f_unit" value="${esc(s.unit||it.unit||'Nos')}" readonly></div><div class="field"><label>Rate</label><input id="f_rate" type="number" min="0" step="0.01" value="${num(s.rate)}"></div><div class="field"><label>Discount</label><input id="f_disc" type="number" min="0" step="0.01" value="${num(s.discount)}"></div><div class="field"><label>Total</label><input id="f_total" value="${money(num(s.total))}" readonly></div><div class="field"><label>Payment</label><select id="f_payment"><option>Cash</option><option>Bank</option><option>Credit</option></select></div><div class="field"><label>Account</label><select id="f_account"><option value="">Auto</option>${db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div></div><div class="field"><label>Notes</label><textarea id="f_note">${esc(s.note||'')}</textarea></div></div>`,()=>{let item=db.items.find(i=>i.id===f('f_item')),q=num(f('f_qty')),rate=num(f('f_rate')),disc=num(f('f_disc'));if(!item||q<=0)return toast('Enter item and quantity');if(edit)item.qty-=num(s.qty);item.qty+=q;item.purchaseRate=rate;let tot=Math.max(0,q*rate-disc);let rec={id:s.id||id(),invoice:f('f_inv'),date:f('f_date'),supplierId:f('f_supplier'),itemId:item.id,qty:q,unit:f('f_unit'),rate,discount:disc,total:tot,payment:f('f_payment'),accountId:f('f_account'),note:f('f_note'),created:s.created||Date.now()};if(edit)Object.assign(s,rec);else db.purchases.push(rec);save();closeModal();render();toast('Purchase saved')});setTimeout(()=>{const qi=document.getElementById('f_qty'),ri=document.getElementById('f_rate'),di=document.getElementById('f_disc');[qi,ri,di].forEach(x=>x&&x.addEventListener('input',()=>document.getElementById('f_total').value=money(num(qi.value)*num(ri.value)-num(di.value))))},0)}
function nextInvoice(){let n=db.sales.length+1;return (db.settings.prefix||'INV-')+String(n).padStart(4,'0')}function f(id){return document.getElementById(id)?.value||''}
function delRecord(type,rid){if(!confirm('Delete this record?'))return;db[type]=db[type].filter(x=>x.id!==rid);save();render();toast('Deleted')}function delSale(rid){if(!confirm('Delete this sale? Stock will be restored.'))return;let s=db.sales.find(x=>x.id===rid),it=db.items.find(i=>i.id===s?.itemId);if(it)it.qty+=num(s.qty);db.sales=db.sales.filter(x=>x.id!==rid);save();render();toast('Sale deleted')}function delPurchase(rid){if(!confirm('Delete this purchase? Stock will be reduced.'))return;let s=db.purchases.find(x=>x.id===rid),it=db.items.find(i=>i.id===s?.itemId);if(it)it.qty-=num(s.qty);db.purchases=db.purchases.filter(x=>x.id!==rid);save();render();toast('Purchase deleted')}
function saveSettings(){db.settings.businessName=f('biz');db.settings.phone=f('phone');db.settings.address=f('addr');db.settings.currency=f('cur')||'₹';db.settings.dark=document.getElementById('dark').checked;db.settings.negative=document.getElementById('negative').checked;db.settings.prefix=f('prefix')||'INV-';save();render();toast('Settings saved')}function clearData(){if(!confirm('Delete ALL Ledger Lite data? This cannot be undone.'))return;db=structuredClone(defaultData);save();render();toast('All data cleared')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ledger-lite-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(inp){const file=inp.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x!=='object'||!Array.isArray(x.accounts)||!Array.isArray(x.customers)||!Array.isArray(x.transactions)||!Array.isArray(x.sales)||!Array.isArray(x.purchases)||!Array.isArray(x.items))throw Error();if(!confirm('Replace all existing data with this backup?'))return;db={...structuredClone(defaultData),...x};save();render();toast('Backup restored')}catch(e){toast('Invalid backup file')}};r.readAsText(file)}
function printDoc(type,rid){let r=(type==='sale'?db.sales:db.purchases).find(x=>x.id===rid);if(!r)return;let party=type==='sale'?nameParty('customer',r.customerId):nameParty('supplier',r.supplierId),item=db.items.find(i=>i.id===r.itemId);printHtml(`${type==='sale'?'Sales Invoice':'Purchase Invoice'} — ${esc(r.invoice)}`,`<p><b>Date:</b> ${esc(r.date)} &nbsp; <b>${type==='sale'?'Customer':'Supplier'}:</b> ${esc(party)}</p><table class="printtable"><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Discount</th><th>Total</th></tr><tr><td>${esc(item?.name||'')}</td><td>${r.qty} ${esc(r.unit)}</td><td>${money(r.rate)}</td><td>${money(r.discount)}</td><td class="green">${money(r.total)}</td></tr></table><h2>Total: ${money(r.total)}</h2>`)}function printReport(){let s=stats();printHtml('Ledger Lite Report',`<p>${esc(db.settings.businessName||'Business')} · ${today()}</p><table class="printtable"><tr><th>Report</th><th>Amount</th></tr>${[['Sales Revenue',s.sales],['Purchases',s.purchases],['Money Received',s.received],['Money Given',s.given],['Stock Value',s.stock],['Profit',s.profit],['Loss',Math.max(0,-s.profit)],['Customer Outstanding',s.customer],['Supplier Outstanding',s.supplier]].map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td></tr>`).join('')}</table>`)}function printHtml(title,body){let w=window.open('','_blank');if(!w){toast('Allow popups to print');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title><style>body{font:14px Arial;margin:25px;color:#111}.printhead{display:flex;justify-content:space-between;border-bottom:2px solid #2563eb;padding-bottom:10px}.printbrand{background:#2563eb;color:#fff;padding:8px}.printtable{width:100%;border-collapse:collapse}.printtable th,.printtable td{border:1px solid #ccc;padding:8px}.green{color:#16a34a}@media print{button{display:none}}</style></head><body><div class="printhead"><div><h1>Ledger Lite</h1><b>${esc(title)}</b></div><div class="printbrand"><b>Ledger Lite</b><br><small>https://ledger-lite-18.lovable.app/</small></div></div>${body}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
